<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#0f0f10"/>
  <line x1="410" y1="40" x2="410" y2="390" stroke="#2a2a2c" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- LEFT: before -->
  <text x="190" y="40" fill="#9a9a9c" font-size="15" font-weight="700" text-anchor="middle">before: C owns the whole A→C arc</text>
  <g>
    <path d="M 190 120 A 90 90 0 0 1 280 210" fill="none" stroke="#8be3ff" stroke-width="8"/>
    <path d="M 280 210 A 90 90 0 1 1 190 120" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="190" cy="120" r="12" fill="#0f0f10" stroke="#f4d03f" stroke-width="2.5"/><text x="190" y="125" fill="#f4d03f" font-size="13" font-weight="700" text-anchor="middle">A</text>
    <circle cx="280" cy="210" r="12" fill="#0f0f10" stroke="#8be3ff" stroke-width="2.5"/><text x="280" y="215" fill="#8be3ff" font-size="13" font-weight="700" text-anchor="middle">C</text>
    <text x="262" y="150" fill="#8be3ff" font-size="12">C's arc</text>
  </g>
  <text x="190" y="340" fill="#bdbdbf" font-size="13" text-anchor="middle">all keys in A→C live on C</text>

  <!-- RIGHT: after adding node X -->
  <text x="610" y="40" fill="#f4d03f" font-size="15" font-weight="700" text-anchor="middle">after: insert X — only its arc moves</text>
  <g>
    <!-- arc A->X now owned by X (yellow-green), X->C still C (cyan) -->
    <path d="M 610 120 A 90 90 0 0 1 660 138" fill="none" stroke="#c9f06b" stroke-width="8"/>
    <path d="M 660 138 A 90 90 0 0 1 700 210" fill="none" stroke="#8be3ff" stroke-width="8"/>
    <path d="M 700 210 A 90 90 0 1 1 610 120" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="610" cy="120" r="12" fill="#0f0f10" stroke="#f4d03f" stroke-width="2.5"/><text x="610" y="125" fill="#f4d03f" font-size="13" font-weight="700" text-anchor="middle">A</text>
    <circle cx="700" cy="210" r="12" fill="#0f0f10" stroke="#8be3ff" stroke-width="2.5"/><text x="700" y="215" fill="#8be3ff" font-size="13" font-weight="700" text-anchor="middle">C</text>
    <circle cx="660" cy="138" r="13" fill="#0f0f10" stroke="#c9f06b" stroke-width="3"/><text x="660" y="143" fill="#c9f06b" font-size="13" font-weight="700" text-anchor="middle">X</text>
  </g>
  <text x="610" y="330" fill="#c9f06b" font-size="13" text-anchor="middle">X steals only the A→X keys from C</text>
  <text x="610" y="352" fill="#96dc96" font-size="13.5" text-anchor="middle">every other key stays put → O(1/N) moved</text>

  <text x="40" y="412" fill="#888" font-size="13">Monotonicity: a new token captures one arc from its clockwise-next neighbor and disturbs nothing else. Schematic (illustrative).</text>
</svg>
