<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ARTICLE_TITLE}} 陪读 PPT</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: #0f0f10;
    color: #e4e4e6;
    line-height: 1.7;
  }
  .deck { display: flex; min-height: 100vh; }

  /* TOC */
  .toc {
    width: 280px;
    background: #08080a;
    border-right: 1px solid #222;
    padding: 24px 18px 60px;
    overflow-y: auto;
    height: 100vh;
    position: sticky;
    top: 0;
    font-size: 13px;
  }
  .toc-title { color: #f4d03f; font-weight: 700; font-size: 14px; margin: 0 0 12px; letter-spacing: 0.5px; }
  .toc-part {
    color: #f4d03f;
    font-weight: 600;
    font-size: 12px;
    margin: 22px 0 6px;
    padding: 4px 8px;
    background: rgba(244,208,63,0.08);
    border-left: 2px solid #f4d03f;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .toc a {
    display: block;
    color: #888;
    text-decoration: none;
    padding: 5px 8px 5px 14px;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .toc a:hover { color: #f4d03f; border-left-color: #555; }
  .toc a.active { color: #f4d03f; border-left-color: #f4d03f; background: rgba(244,208,63,0.06); }

  /* Slides */
  .slides {
    flex: 1;
    max-width: 920px;
    padding: 48px 64px 200px;
  }
  .slide {
    min-height: 70vh;
    padding: 36px 0 60px;
    border-bottom: 1px dashed #2a2a2c;
    scroll-margin-top: 12px;
  }
  .slide:last-child { border-bottom: none; }
  .slide-num {
    color: #555;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .slide h2 {
    color: #f4d03f;
    font-size: 30px;
    margin: 0 0 22px;
    line-height: 1.3;
    border-left: 4px solid #f4d03f;
    padding-left: 16px;
  }
  .slide h3 {
    color: #e4e4e6;
    font-size: 19px;
    margin: 24px 0 10px;
  }
  .slide p, .slide ul, .slide ol { font-size: 17px; }
  .slide ul, .slide ol { padding-left: 24px; }
  .slide li { margin: 6px 0; }
  .slide strong { color: #f4d03f; font-weight: 600; }
  .slide em { color: #8be3ff; font-style: normal; }

  /* code + diagrams */
  pre, code {
    font-family: "JetBrains Mono", "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, monospace;
  }
  code {
    background: #1a1a1c;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 14px;
    color: #f4d03f;
  }
  pre {
    background: #07070a;
    border: 1px solid #2a2a2c;
    border-left: 3px solid #f4d03f;
    padding: 16px 20px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.5;
    color: #c8c8cc;
    border-radius: 4px;
    margin: 16px 0;
  }
  pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }

  /* boxes */
  .takeaway {
    background: linear-gradient(180deg, rgba(244,208,63,0.08), rgba(244,208,63,0.03));
    border: 1px solid rgba(244,208,63,0.4);
    padding: 14px 18px 14px 50px;
    margin: 20px 0 0;
    border-radius: 6px;
    position: relative;
    font-size: 16.5px;
  }
  .takeaway::before {
    content: "▸";
    color: #f4d03f;
    font-size: 22px;
    font-weight: bold;
    position: absolute;
    left: 18px;
    top: 11px;
  }
  .takeaway b { color: #f4d03f; }
  .analogy {
    background: rgba(139,227,255,0.06);
    border-left: 3px solid #8be3ff;
    padding: 12px 18px;
    margin: 16px 0;
    border-radius: 0 4px 4px 0;
    font-size: 16px;
  }
  .analogy::before {
    content: "类比  ";
    color: #8be3ff;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 12px;
    display: inline-block;
    padding: 1px 7px;
    background: rgba(139,227,255,0.15);
    border-radius: 3px;
    margin-right: 10px;
  }
  .example {
    background: rgba(150,220,150,0.05);
    border-left: 3px solid #96dc96;
    padding: 12px 18px;
    margin: 16px 0;
    border-radius: 0 4px 4px 0;
    font-size: 16px;
  }
  .example::before {
    content: "例子  ";
    color: #96dc96;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 12px;
    display: inline-block;
    padding: 1px 7px;
    background: rgba(150,220,150,0.15);
    border-radius: 3px;
    margin-right: 10px;
  }
  .warning {
    background: rgba(255,140,90,0.06);
    border-left: 3px solid #ff8c5a;
    padding: 12px 18px;
    margin: 16px 0;
    border-radius: 0 4px 4px 0;
    font-size: 16px;
  }
  .warning::before {
    content: "注意  ";
    color: #ff8c5a;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 12px;
    display: inline-block;
    padding: 1px 7px;
    background: rgba(255,140,90,0.15);
    border-radius: 3px;
    margin-right: 10px;
  }
  .deepdive {
    background: rgba(180,140,255,0.05);
    border-left: 3px solid #b48cff;
    padding: 14px 18px;
    margin: 18px 0;
    border-radius: 0 4px 4px 0;
    font-size: 15px;
  }
  .deepdive-title {
    color: #b48cff;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .deepdive-title::before { content: "▼ "; }
  .deepdive ul { margin: 0; padding: 0; list-style: none; }
  .deepdive li {
    margin: 6px 0;
    padding-left: 14px;
    position: relative;
    line-height: 1.55;
  }
  .deepdive li::before {
    content: "›";
    color: #b48cff;
    position: absolute;
    left: 0;
    font-weight: bold;
  }
  .deepdive a {
    color: #c4a4ff;
    text-decoration: underline;
    text-decoration-color: rgba(196,164,255,0.4);
    text-underline-offset: 2px;
  }
  .deepdive a:hover {
    color: #d8c0ff;
    text-decoration-color: #d8c0ff;
  }
  .deepdive .meta {
    color: #888;
    font-size: 13px;
    margin-left: 4px;
  }

  /* tables */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }
  th, td {
    border: 1px solid #2a2a2c;
    padding: 10px 14px;
    text-align: left;
    vertical-align: top;
  }
  th { background: rgba(244,208,63,0.08); color: #f4d03f; font-weight: 600; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

  /* svg style */
  svg { display: block; max-width: 100%; margin: 16px 0; }

  /* figure / image */
  .figure {
    margin: 22px 0;
    text-align: center;
  }
  .figure img {
    max-width: 100%;
    max-height: 480px;
    border-radius: 6px;
    border: 1px solid #2a2a2c;
    background: #1a1a1c;
    display: block;
    margin: 0 auto;
  }
  .figure-caption {
    color: #888;
    font-size: 13px;
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.2px;
  }
  .figure-caption .src {
    color: #666;
    font-style: normal;
  }
  .figure-row {
    display: flex;
    gap: 14px;
    margin: 22px 0;
    flex-wrap: wrap;
  }
  .figure-row .figure {
    flex: 1;
    min-width: 260px;
    margin: 0;
  }
  .figure-row .figure img {
    max-height: 340px;
  }

  /* nav controls */
  .nav-controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    gap: 8px;
    background: rgba(20,20,22,0.92);
    padding: 8px;
    border-radius: 999px;
    border: 1px solid #2a2a2c;
    backdrop-filter: blur(6px);
    z-index: 100;
  }
  .nav-controls button {
    background: #1a1a1c;
    color: #aaa;
    border: 1px solid #333;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .nav-controls button:hover { background: #f4d03f; color: #000; border-color: #f4d03f; }
  .progress {
    color: #888;
    font-size: 13px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    font-family: monospace;
  }
  .progress .cur { color: #f4d03f; }

  /* mobile */
  @media (max-width: 768px) {
    .deck { flex-direction: column; }
    .toc { width: 100%; height: auto; position: relative; max-height: 200px; }
    .slides { padding: 24px; }
  }
</style>
</head>
<body>
<div class="deck">
  <nav class="toc" id="toc">
    <div class="toc-title">{{DECK_TITLE}}</div>
    <div class="toc-part">第一部分 · 基础知识</div>
    <!-- TOC_INSERT_PART1 -->
    <div class="toc-part">第二部分 · 文章逐段</div>
    <!-- TOC_INSERT_PART2 -->
  </nav>

  <main class="slides" id="slides">

  <!-- ====== PART 1: FOUNDATION SLIDES ====== -->
  <!-- INSERT_PART1_SLIDES -->

  <!-- ====== PART 2: ARTICLE WALKTHROUGH SLIDES ====== -->
  <!-- INSERT_PART2_SLIDES -->

  </main>
</div>

<div class="nav-controls">
  <button id="prev" title="上一张">◂</button>
  <div class="progress"><span class="cur">01</span>&nbsp;/&nbsp;<span class="total">00</span></div>
  <button id="next" title="下一张">▸</button>
</div>

<script>
(function() {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var tocLinks = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var cur = document.querySelector('.progress .cur');
  var total = document.querySelector('.progress .total');
  total.textContent = String(slides.length).padStart(2, '0');

  function activeIdx() {
    var y = window.scrollY + 100;
    for (var i = slides.length - 1; i >= 0; i--) {
      if (slides[i].offsetTop <= y) return i;
    }
    return 0;
  }
  function updateTOC() {
    var i = activeIdx();
    cur.textContent = String(i + 1).padStart(2, '0');
    var id = slides[i].id;
    tocLinks.forEach(function(a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + id);
    });
    var active = document.querySelector('.toc a.active');
    if (active) {
      var toc = document.getElementById('toc');
      var ar = active.getBoundingClientRect();
      var tr = toc.getBoundingClientRect();
      if (ar.top < tr.top + 40 || ar.bottom > tr.bottom - 40) {
        active.scrollIntoView({block: 'center'});
      }
    }
  }
  function goto(i) {
    if (i < 0 || i >= slides.length) return;
    slides[i].scrollIntoView({behavior: 'smooth', block: 'start'});
  }
  document.getElementById('prev').onclick = function() { goto(activeIdx() - 1); };
  document.getElementById('next').onclick = function() { goto(activeIdx() + 1); };
  document.addEventListener('keydown', function(e) {
    // 在输入框/文本域/可编辑区（如问答抽屉）里打字时，不要触发翻页
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable ||
              (t.closest && t.closest('.qa-drawer')))) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goto(activeIdx() - 1); }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goto(activeIdx() + 1); }
  });
  window.addEventListener('scroll', updateTOC, {passive: true});
  updateTOC();
})();
</script>
</body>
</html>
